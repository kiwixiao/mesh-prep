[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-prep"
version = "0.1.0"
description = "Interactive STL boundary patch clipper for CFD mesh preparation"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "PyQt5",
    "pyvista",
    "pyvistaqt",
    "scipy",
    "vtk",
]

[project.optional-dependencies]
centerline = ["vmtk"]
run = ["matplotlib"]
repair = ["pymeshfix"]

[project.scripts]
mesh-prep = "mesh_prep.stl_clipper:main"
mesh-prep-create = "mesh_prep.create_case:main"
mesh-render = "mesh_prep.render_cli:main"

[tool.setuptools.packages.find]
include = ["mesh_prep*"]

[tool.setuptools.package-data]
mesh_prep = ["templates/**/*"]
