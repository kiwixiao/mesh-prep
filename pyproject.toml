[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-prep"
version = "0.1.0"
description = "Interactive STL boundary patch clipper for CFD mesh preparation"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pyvista",
    "pyvistaqt",
    "vtk",
]

[project.optional-dependencies]
vmtk = ["vmtk"]

[project.scripts]
mesh-prep = "mesh_prep.stl_clipper:main"

[tool.setuptools.packages.find]
include = ["mesh_prep*"]
